<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A pub crawl map for central Copenhagen" />
    <title>Copenhagen Pub Crawl</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="styles.css?v=3" />
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/src/index.ts"></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="route-panel">
        <header>
          <p class="location">Centrala Köpenhamn</p>
          <h1>Pubrunda</h1>
          <p id="route-summary" class="route-summary"></p>
          <nav class="route-mode" aria-label="Välj typ av pubrunda">
            <a
              id="default-route-link"
              href="./"
              aria-label="Visa alla stopp"
            >Alla</a>
            <a
              id="satisfied-route-link"
              href="?data=data/satisfied-crawl.json"
              aria-label="Visa första okej pubrundan"
            >Okej</a>
            <a
              id="optimized-route-link"
              href="?data=data/optimized-crawl.json"
            >Optimal</a>
          </nav>
        </header>

        <button id="hotel-button" class="hotel-button" type="button">
          <span id="hotel-symbol" class="hotel-symbol" aria-hidden="true"></span>
          <span class="hotel-details">
            <span class="hotel-kicker">Vårt hotel</span>
            <strong id="hotel-name"></strong>
            <span id="hotel-address"></span>
          </span>
        </button>

        <p class="stops-heading">Pubbar</p>
        <ol id="stop-list" class="stop-list" aria-label="Pub crawl stops"></ol>
      </aside>

      <section class="map-region" aria-label="Map of the pub crawl">
        <div id="map"></div>
      </section>
    </main>

    <noscript>This map needs JavaScript enabled.</noscript>
  </body>
</html>
